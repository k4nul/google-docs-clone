[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dotenvy = "0.15"
fjall = "3.1.4"
futures-util = "0.3"
heed = "0.22"
jammdb = "0.11"
native_db = "0.8.2"
native_model = "=0.4.20"
parity-db = "0.5.4"
persy = "1.7.1"
pickledb = "0.5.1"
microkv = "0.2.9"
redb = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
rustbreak = { version = "2", features = ["bin_enc"] }
s3 = { version = "0.1.27", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
yrs = "=0.18.2"
yrs-axum = "0.8.2"

[dev-dependencies]
axum-test = { version = "20.0.0", features = ["ws"] }
