[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aeternusdb = "1.0.1"
abyssiniandb = "0.1.4"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22.1"
btree-store = "0.1.4"
canopydb = "0.2.5"
chrono = { version = "0.4", features = ["serde"] }
ckydb = "0.0.5"
dashmap = "6"
dblite = { version = "0.1.2", default-features = false }
dbless = "0.2.0"
docdb = "0.1.0"
dotenvy = "0.15"
flash-kv = "0.2.1"
fjall = "3.1.4"
futures-util = "0.3"
heed = "0.22"
hightower-kv = "0.1.5"
jammdb = "0.11"
native_db = "0.8.2"
native_model = "=0.4.20"
nikidb = "0.1.1"
nodb = "0.2.2"
parity-db = "0.5.4"
persy = "1.7.1"
persistent-kv = "1.0.2"
pickledb = "0.5.1"
microkv = "0.2.9"
redb = "2"
readb = { version = "0.4.1", features = ["write"] }
rskey = "0.4.0"
rustlite = "0.8.0"
rusqlite = { version = "0.37", features = ["bundled"] }
rustbreak = { version = "2", features = ["bin_enc"] }
snaildb = "0.2.2"
scdb = "0.2.1"
s3 = { version = "0.1.27", default-features = false, features = ["blocking", "rustls"] }
sanakirja = "2.0.0-beta"
siamesedb = "0.1.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_db = "0.1.2"
sled = "0.34"
structsy = { version = "0.5.2", features = ["derive"] }
surrealkv = "0.21.0"
thunderdb = "0.4.0"
thiserror = "2"
tinykv = "0.4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
yedb = "0.5.1"
yrs = "=0.18.2"
yrs-axum = "0.8.2"
shorterDB = "0.2.0"

[dev-dependencies]
axum-test = { version = "20.0.0", features = ["ws"] }
